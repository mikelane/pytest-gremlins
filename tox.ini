[tox]
envlist =
    py311
    py312
    py313
    py314
    lint
    typecheck
    docs
isolated_build = true
requires =
    tox>=4.11
    tox-uv>=1.0

[testenv]
description = Run tests with pytest
deps =
    pytest>=8.4.2
    pytest84: pytest==8.4.2
    pytest84: pytest-test-categories<1.2.2
    pytest90: pytest==9.0.0
    pytest90: pytest-test-categories<1.2.2
    pytest-cov>=4.1.0
    pytest-test-categories>=1.0.0
    pytest-rerunfailures>=16.7
    pytest-xdist>=3.5.0
    coverage[toml]>=7.0.0
    pre-commit>=4.6.2,<5
    pyyaml>=6.0
    mypy>=1.7.0
    jsonschema>=4.26.0
commands =
    pytest {posargs:tests -m "small or medium" --cov=pytest_gremlins --cov-report=term-missing}

[testenv:small]
description = Run only small (unit) tests
# Pass a path to narrow the run: `tox -e small -- tests/plugin/test_x.py`.
# Without a path the whole tests/ tree runs (about 4,400 tests; many minutes).
commands =
    pytest -m small {posargs:tests}

[testenv:medium]
description = Run small and medium tests
# Pass a path to narrow the run: `tox -e medium -- tests/plugin/test_x.py`.
# Without a path the whole tests/ tree runs (about 4,400 tests; many minutes).
# For a quick single-file check, `uv run pytest -m medium <file>` in the dev venv
# skips tox env creation.
commands =
    pytest -m "small or medium" {posargs:tests}

[testenv:large]
description = Run all tests including large (e2e)
commands =
    pytest {posargs:--cov=pytest_gremlins --cov-report=term-missing}

[testenv:lint]
description = Run linting with the ruff locked in uv.lock
skip_install = true
allowlist_externals = uv
deps =
commands =
    uv run --frozen ruff check src tests
    uv run --frozen ruff format --check src tests

[testenv:typecheck]
description = Run type checking with the mypy locked in uv.lock, over src and tests
skip_install = true
allowlist_externals = uv
deps =
commands =
    uv run --frozen mypy

[testenv:docs]
description = Build documentation
deps =
    mkdocs>=1.5.0
    mkdocs-material>=9.7.7
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs build --strict

[testenv:docs-serve]
description = Serve documentation locally
deps =
    mkdocs>=1.5.0
    mkdocs-material>=9.7.7
    mkdocstrings[python]>=0.24.0
commands =
    mkdocs serve

[testenv:security]
description = Run security audit
skip_install = true
deps =
    pip-audit>=2.6.0
commands =
    pip-audit

[testenv:doctest]
description = Run doctests
commands =
    pytest --doctest-modules src/pytest_gremlins {posargs}
