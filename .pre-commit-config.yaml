default_language_version:
  python: python3.11

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        files: ^(src|tests)/

  # Ruff and mypy run from the uv environment so uv.lock is the single source of
  # truth for tool versions (commit hook, pre-push hook, and CI all agree).
  # Contributors need `uv sync --dev` before committing.
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff check (uv)
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format-fix
        name: ruff format (uv)
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: mypy-commit
        name: mypy (uv, strict via pyproject)
        entry: uv run --frozen mypy src/pytest_gremlins
        language: system
        files: ^src/
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

  # Conventional commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.7
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # Validate pyproject.toml
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        files: \.(md|markdown)$

  # Spell checking
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.6.0
    hooks:
      - id: cspell
        args: [--config, cspell.json]
        files: \.(md|markdown)$

  # Mock spec enforcement
  - repo: local
    hooks:
      - id: no-bare-magicmock
        name: no bare MagicMock()
        entry: python scripts/check_mock_spec.py
        language: system
        files: ^tests/.*\.py$
        types: [python]

  # Pre-push quality gate - run full CI checks before push
  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (full codebase)
        entry: uv run ruff check src tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check src tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: mypy-strict
        name: mypy (strict)
        entry: uv run mypy src/pytest_gremlins
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: pytest-fast
        name: pytest (small tests)
        entry: uv run pytest tests -m small -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

ci:
  autofix_commit_msg: |
    style: auto-fix from pre-commit hooks

    For more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore: update pre-commit hook versions'
  autoupdate_schedule: weekly
  # uv-based local hooks need uv and the project env, which pre-commit.ci lacks
  skip: [ruff-check-fix, ruff-format-fix, mypy-commit, cspell]
  submodules: false
