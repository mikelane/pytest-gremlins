version: 2
updates:
  # ── Python / uv ───────────────────────────────────────────────────────────
  # Dependabot reads pyproject.toml + uv.lock natively (uv ecosystem support
  # added Oct 2024).  Groups batch-update related packages to avoid PR spam.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docs-deps:
        # mkdocs + mkdocstrings update together — they have coupled version reqs
        patterns:
          - 'mkdocs*'
          - 'mkdocstrings*'

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Groups keep all actions/* in one PR and all astral-sh/* in another,
  # rather than generating a separate PR per action per week.
  #
  # Every action is pinned to a full commit SHA with its release tag in a trailing
  # comment (enforced by tests/config/test_workflow_action_pins.py). Dependabot
  # updates both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions-core:
        # actions/checkout, upload-artifact, download-artifact, setup-node
        patterns:
          - 'actions/*'
      astral-sh:
        patterns:
          - 'astral-sh/*'
      third-party-actions:
        # dorny, codecov, lycheeverse, softprops
        patterns:
          - 'dorny/*'
          - 'codecov/*'
          - 'lycheeverse/*'
          - 'softprops/*'
