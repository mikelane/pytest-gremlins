name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  cut-release:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Show unreleased commits
        run: |
          echo "### Unreleased commits" >> "$GITHUB_STEP_SUMMARY"
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$last_tag" ]]; then
            git log --oneline "${last_tag}..HEAD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no previous tag — this will be the first release)" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bump version
        run: |
          bump_type="${{ inputs.bump }}"
          if [[ "$bump_type" == "auto" ]]; then
            uv run cz bump --yes
          else
            uv run cz bump --yes --increment "${bump_type^^}"
          fi

      - name: Push commit and tag
        run: git push origin HEAD:refs/heads/${{ github.ref_name }} --follow-tags

      - name: Report new version
        run: |
          new_tag=$(git describe --tags --abbrev=0)
          echo "### Released: ${new_tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "The tag push will trigger \`release.yml\` to publish to PyPI." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Monitor release pipeline](https://github.com/mikelane/pytest-gremlins/actions/workflows/release.yml)" >> "$GITHUB_STEP_SUMMARY"
