name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How to bump the version. "auto" detects bump type from conventional commits (recommended).'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release identifier. Leave empty for a stable release.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - alpha
          - beta
          - rc

jobs:
  cut-release:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13.0"
          prune-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify releasable commits exist
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "### Commits since last release" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$last_tag" ]]; then
            commit_count=$(git rev-list --count "${last_tag}..HEAD")
            if [[ "$commit_count" -eq 0 ]]; then
              echo "::error::No commits since ${last_tag}. Merge new PRs to main before cutting a release."
              echo "No commits since **${last_tag}**. Merge new PRs to main before cutting a release." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "${commit_count} commits since ${last_tag}:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline "${last_tag}..HEAD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(No previous tag found -- this will be the first release.)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fail before a tag exists. The version is the one `cz bump` is about to produce.
      # release.yml runs the same check again on the tag; that run is the one that blocks a publish.
      - name: Check the changelog entry links to the docs
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          bump_args=()
          if [[ "$BUMP_TYPE" != "auto" ]]; then
            bump_args+=(--increment "${BUMP_TYPE^^}")
          fi
          if [[ -n "$PRERELEASE" ]]; then
            bump_args+=(--prerelease "$PRERELEASE")
          fi
          next_version=$(uv run cz bump --get-next "${bump_args[@]}")
          echo "Checking the changelog entry for v${next_version}"
          uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
          uv run python scripts/check_release_docs.py "$next_version" --site-dir "$RUNNER_TEMP/site"
          # Guarded code changed since the previous release needs a raised cache marker or a "(cache kept: ...)" line.
          uv run python scripts/check_cache_kept.py "$next_version"

      - name: Bump version and create tag
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_args=""
          if [[ -n "$PRERELEASE" ]]; then
            prerelease_args="--prerelease ${PRERELEASE}"
          fi

          if [[ "$BUMP_TYPE" == "auto" ]]; then
            # shellcheck disable=SC2086
            uv run cz bump --yes $prerelease_args 2>&1 | tee /tmp/cz-bump-output.txt
          else
            # shellcheck disable=SC2086
            uv run cz bump --yes --increment "${BUMP_TYPE^^}" $prerelease_args 2>&1 | tee /tmp/cz-bump-output.txt
          fi

          new_tag=$(git describe --tags --abbrev=0)
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Pushing ${NEW_TAG} to origin..."
          if ! git push origin "HEAD:refs/heads/${REF_NAME}" --follow-tags 2>&1; then
            echo "::error::git push failed. The RELEASE_PAT secret may have expired (90-day expiry). Verify the token at Settings > Secrets > RELEASE_PAT."
            exit 1
          fi
          if ! git push origin "${NEW_TAG}" 2>&1; then
            echo "::error::Tag push failed for ${NEW_TAG}. Verify the RELEASE_PAT secret has not expired."
            exit 1
          fi

      - name: Summarize release
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          echo "### Released ${NEW_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The tag push triggers the release pipeline, which runs tests, publishes to PyPI, and creates a GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Monitor the release pipeline](https://github.com/mikelane/pytest-gremlins/actions/workflows/release.yml)" >> "$GITHUB_STEP_SUMMARY"
