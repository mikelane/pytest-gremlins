name: Large Tier

# The PR gate runs `small or medium`. This workflow runs the `large` tier nightly so a red large test
# surfaces within a day. A failing test fails the job. GitHub notifies the user who last edited the cron
# schedule of a failed scheduled run, not the people watching the repository.
#
# The large tier runs on ubuntu only, with Python 3.12. #576 scoped it that way on purpose: the tests are slow, and
# the Windows and macOS legs of the PR matrix already cover the platform-specific code with the small and medium tiers.
#
# test_attrs_full skips in this job. It needs the attrs checkout, which only the release attrs-compat job restores,
# and that job runs the test on every release.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  large:
    name: Large tests (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13.0"
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Run the large tier
        run: uv run pytest tests -m large -v
