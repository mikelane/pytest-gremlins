name: Tag Release

# On every push to main (#1046): when the pushed commit is the one that changed [project].version, create the annotated
# tag v<version> and dispatch release.yml for it. All logic lives in scripts/tag_release.py, which has its own tests;
# its docstring holds the state table. cut-release.yml stays as the fallback until #1047.
#
# No personal access token is involved. The job's own token pushes the tag through the REST API, and a tag created
# with GITHUB_TOKEN does not fire release.yml's tag-push trigger, so the explicit dispatch of release.yml is the only
# release run (a dispatch made with GITHUB_TOKEN is allowed).
#
# Nothing the pushed commit changed runs before the tag exists. The scripts that decide and gate the release are read
# from the commit BEFORE the push (the pre-merge main tip) with git show, and run with the system Python from outside the
# workspace, so a release commit cannot edit them to skip a check. The script also refuses a version-changing commit
# that edits this workflow. The remaining limit: GitHub runs a push workflow from the file at the pushed commit, so a
# commit that rewrites this file runs its own YAML. Only review of changes to this file stands between that and a tag
# made without the checks, so the guarantee above is not tamper-proof.
#
# Bootstrap: a before-commit that lacks scripts/tag_release.py cannot supply it, so the export step fails closed
# (exit 2). That will be the first push after this workflow lands; it is not a release commit, and the next push works.
# A push that adds several commits fails the same way and is never released.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag-release:
    name: Tag and dispatch a release commit
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch release.yml
      issues: read # the release-blocker gate
      pull-requests: read # find the release pull request of this commit

    steps:
      # Two commits: the scripts are exported from the commit before the push, which equals the parent for a one-commit push.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # check_ci_passed.py is imported by check_no_release_blockers.py; the guard imports check_release_docs.py.
      - name: Export the release scripts from the commit before the push
        id: export
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # BEFORE is main before this push. With fetch-depth 2 it is in the checkout only when the push added one commit.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::the push has no usable before-commit (empty or all zeros); the release scripts run from it"
            exit 2
          fi
          if ! git cat-file -e "$BEFORE^{commit}"; then
            echo "::error::$BEFORE is not in the checkout: the push added more than one commit, so it cannot be a release"
            exit 2
          fi
          dir="$(mktemp -d "$RUNNER_TEMP/release-scripts.XXXXXX")"
          for script in tag_release.py check_no_release_blockers.py check_ci_passed.py check_version_change.py check_release_docs.py; do
            if ! git show "$BEFORE:scripts/$script" > "$dir/$script"; then
              echo "::error::$script is missing at $BEFORE; the release scripts run from the commit before the push"
              exit 2
            fi
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # The checkout has no tags, so the script asks origin (git ls-remote) for the tag a version needs.
      - name: Tag the release commit and dispatch release.yml
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          SCRIPTS_DIR: ${{ steps.export.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          /usr/bin/python3 -I "$SCRIPTS_DIR/tag_release.py" --sha "$SHA" --before "$BEFORE" --repo "$GITHUB_WORKSPACE"
