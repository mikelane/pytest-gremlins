name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint.json'
      - 'cspell.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - '.github/workflows/docs.yml'
      - '.markdownlint.json'
      - 'cspell.json'
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC. Runs only the action cookbook drift check.
    - cron: '17 6 * * 1'

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  build:
    name: Build & Validate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13.0"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --only-group docs

      - name: Build documentation (strict mode)
        run: uv run mkdocs build --strict

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7

  lint-markdown:
    name: Lint Markdown
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: markdownlint 'docs/**/*.md' '*.md' --config .markdownlint.json

  check-links:
    name: Check Links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site/

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir ${{ github.workspace }}/site
            --offline
            --no-progress
            --exclude-path ${{ github.workspace }}/site/assets
            ${{ github.workspace }}/site/**/*.html
          fail: true

  spell-check:
    name: Spell Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell

      - name: Check spelling
        run: cspell --config cspell.json "docs/**/*.md" "*.md"

  all-docs-checks:
    name: All Docs Checks Passed
    runs-on: ubuntu-latest
    needs: [build, lint-markdown, check-links, spell-check]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Verify all jobs succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint-markdown.result }}
          LINKS_RESULT: ${{ needs.check-links.result }}
          SPELL_RESULT: ${{ needs.spell-check.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]] || \
             [[ "$LINT_RESULT" != "success" ]] || \
             [[ "$LINKS_RESULT" != "success" ]] || \
             [[ "$SPELL_RESULT" != "success" ]]; then
            echo "One or more documentation checks failed"
            echo "Build: $BUILD_RESULT"
            echo "Lint: $LINT_RESULT"
            echo "Links: $LINKS_RESULT"
            echo "Spell: $SPELL_RESULT"
            exit 1
          fi
          echo "All documentation checks passed!"

  check-action-cookbook:
    name: Check Action Cookbook
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ACTION_REPO: mikelane/pytest-gremlins-action
      ISSUE_TITLE: 'Docs drift: GitHub Action cookbook does not match pytest-gremlins-action'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ">=0.13.0"
          prune-cache: true

      - name: Fetch action.yml from the action's default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${ACTION_REPO}/contents/action.yml" \
              -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/action.yml"; then
            echo "::error::Could not fetch action.yml from ${ACTION_REPO}. This is a fetch failure, not docs drift."
            exit 1
          fi

      - name: Compare the cookbook with action.yml
        id: compare
        run: |
          set +e
          uv run --no-project --with pyyaml python scripts/check_action_cookbook.py \
            "${RUNNER_TEMP}/action.yml" docs/cookbook/github-action.md | tee "${RUNNER_TEMP}/drift.txt"
          status="${PIPESTATUS[0]}"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # Only the script's DRIFT: lines count as drift; an exit 1 from uv or PyPI never prints one.
          if grep -q '^DRIFT: ' "${RUNNER_TEMP}/drift.txt"; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$status" == "2" ]]; then
            echo "::error::Could not parse action.yml or the cookbook. This is a parse failure, not docs drift."
          fi
          exit "$status"

      - name: Open or update the drift issue
        if: failure() && steps.compare.outputs.status == '1' && steps.compare.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The inputs or outputs in \`docs/cookbook/github-action.md\` no longer match \`action.yml\` on the default branch of ${ACTION_REPO}."
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/drift.txt"
            echo '```'
            echo
            echo "Found by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/issue-body.md"

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label documentation --state open \
            --search "\"${ISSUE_TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == \"${ISSUE_TITLE}\"))[0].number // empty")"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/issue-body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label documentation \
              --title "$ISSUE_TITLE" --body-file "${RUNNER_TEMP}/issue-body.md"
          fi
