name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '*.md'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy src/pytest_gremlins

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.src == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        env:
          COVERAGE_PROCESS_START: pyproject.toml
          PYTHONPATH: .
        run: |
          uv run coverage run -m pytest tests -m "small or medium and not wip" -v
          uv run coverage combine --quiet || echo "::warning::No coverage data to combine (expected in some environments)"
          uv run coverage report --show-missing
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run doctests
        # Disable test-category hermeticity enforcement for doctests: doctests
        # have no mechanism to declare a size marker, so pytest-test-categories
        # flags incidental reads (e.g. ~/.pdbrc from pdb internals) as violations.
        run: uv run pytest --doctest-modules src/pytest_gremlins --override-ini="test_categories_enforcement=disabled"

      - name: Build docs
        run: uv run mkdocs build --strict

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run pip-audit
        run: uv run pip-audit --ignore-vuln CVE-2026-4539  # pygments: no fix available yet

  attrs-smoke:
    name: Attrs Smoke Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Restore attrs checkout cache
        id: attrs-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Clone attrs on cache miss
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/python-attrs/attrs.git /tmp/attrs-checkout
          cd /tmp/attrs-checkout
          git checkout bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Save attrs checkout cache
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Run attrs smoke test
        run: uv run pytest tests/integration/test_attrs_smoke.py -m medium -v

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, docs, security, attrs-smoke]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          SRC_CHANGED: ${{ needs.changes.outputs.src }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ATTRS_SMOKE_RESULT: ${{ needs.attrs-smoke.result }}
        run: |
          # For docs-only changes, skip src-related checks
          if [[ "$SRC_CHANGED" == "true" ]]; then
            if [[ "$LINT_RESULT" != "success" ]] || \
               [[ "$TYPECHECK_RESULT" != "success" ]] || \
               [[ "$TEST_RESULT" != "success" ]] || \
               [[ "$SECURITY_RESULT" != "success" ]] || \
               [[ "$ATTRS_SMOKE_RESULT" != "success" ]]; then
              echo "Source code checks failed"
              exit 1
            fi
          fi

          # Docs check runs for both src and docs changes
          if [[ "$SRC_CHANGED" == "true" ]] || [[ "$DOCS_CHANGED" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation check failed"
              exit 1
            fi
          fi

          echo "All required checks passed!"
