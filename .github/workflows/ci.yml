name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'tox.ini'
              - 'uv.lock'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '*.md'
            changelog:
              - 'CHANGELOG.md'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.src == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        shell: bash
        env:
          COVERAGE_PROCESS_START: pyproject.toml
          PYTHONPATH: .
        run: |
          uv run coverage run -m pytest tests -m "small or medium and not wip" -v
          uv run coverage combine --quiet || echo "::warning::No coverage data to combine (expected in some environments)"
          uv run coverage report --show-missing
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  pytest-compat:
    name: Test (pytest ${{ matrix.pytest }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    env:
      UV_PYTHON: '3.12'
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release of each supported pytest major, then the latest release.
        # The first entry must equal the pytest floor in pyproject.toml and tox.ini
        # (guarded by tests/config/test_pytest_version_matrix.py).
        pytest: ['8.4.2', '9.0.0', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install pytest ${{ matrix.pytest }}
        env:
          PYTEST_VERSION: ${{ matrix.pytest }}
        run: |
          # pytest-test-categories 1.2.2 needs pytest>=9.1.1; 1.2.1 is the newest release for older pytest.
          if [[ "$PYTEST_VERSION" == "latest" ]]; then
            uv pip install --python .venv/bin/python --upgrade pytest pytest-test-categories
          else
            uv pip install --python .venv/bin/python "pytest==$PYTEST_VERSION" "pytest-test-categories<1.2.2"
          fi
          uv pip check --python .venv/bin/python
          uv run --no-sync pytest --version

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run --no-sync pytest tests -m "small or medium and not wip" -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.src == 'true'
    steps:
      # Full history and tags: the cache gate below compares the code with the previous release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run doctests
        # Disable test-category hermeticity enforcement for doctests: doctests
        # have no mechanism to declare a size marker, so pytest-test-categories
        # flags incidental reads (e.g. ~/.pdbrc from pdb internals) as violations.
        run: uv run pytest --doctest-modules src/pytest_gremlins --override-ini="test_categories_enforcement=disabled"

      - name: Build docs
        run: uv run mkdocs build --strict

      # The topmost entry is the one being prepared for release. The release itself runs the same check.
      - name: Check the newest changelog entry links to the docs
        if: needs.changes.outputs.changelog == 'true'
        run: uv run python scripts/check_release_docs.py --newest --site-dir site

      # Guarded code changed since the previous release with no cache marker raised needs a "(cache kept: ...)" line.
      - name: Check the newest changelog entry raises a cache marker or keeps the cache on purpose
        if: needs.changes.outputs.changelog == 'true'
        run: uv run python scripts/check_cache_kept.py --newest

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run pip-audit
        run: uv run pip-audit

  attrs-smoke:
    name: Attrs Smoke Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Restore attrs checkout cache
        id: attrs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Clone attrs on cache miss
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/python-attrs/attrs.git /tmp/attrs-checkout
          cd /tmp/attrs-checkout
          git checkout bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Save attrs checkout cache
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Run attrs smoke test
        run: uv run pytest tests/integration/test_attrs_smoke.py -m medium -v

  # The paths come from the cache-version guard's own guarded_sources(), so a new package file is covered at once.
  verdict-changes:
    name: Detect Verdict-Guarded Changes
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    outputs:
      guarded: ${{ steps.guarded.outputs.guarded }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # A pull request and a merge group both check out a merge onto main, so its merge base with main is the base.
      # On a push to main the merge base is HEAD itself, so nothing counts as changed.
      - name: Find the base commit
        id: base
        run: |
          git fetch --no-tags origin main
          echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

      - name: List changed guarded paths
        id: guarded
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          paths=$(uv run --no-sync python scripts/check_verdict_change.py guarded-changes "$BASE_SHA")
          if [[ -n "$paths" ]]; then
            printf 'Guarded paths changed since %s:\n%s\n' "$BASE_SHA" "$paths"
            echo "guarded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No guarded path changed since $BASE_SHA"
            echo "guarded=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs pytest-gremlins on the fixed sample with the base and the head package, the gremlin cache off (it is off
  # unless --gremlin-cache or cache = true asks for it), and fails when a verdict changed without a marker bump.
  verdict-change:
    name: Verdict Change Check
    runs-on: ubuntu-latest
    needs: verdict-changes
    if: needs.verdict-changes.outputs.guarded == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Both runs use the same sample directory, so gremlin paths match between them.
      - name: Record head verdicts
        run: >-
          uv run --no-sync python scripts/check_verdict_change.py run
          --out "$RUNNER_TEMP/head.json" --workdir "$RUNNER_TEMP/verdict-sample"

      # The head's sample and script stay; only the installed package is swapped for the base's.
      - name: Install the base package
        env:
          BASE_SHA: ${{ needs.verdict-changes.outputs.base-sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          uv pip install --python .venv/bin/python --no-deps --reinstall "$RUNNER_TEMP/base"

      - name: Record base verdicts
        run: >-
          uv run --no-sync python scripts/check_verdict_change.py run
          --out "$RUNNER_TEMP/base.json" --workdir "$RUNNER_TEMP/verdict-sample"

      # A marker the PR lowers may go back to the value at the newest release tag reachable from the base.
      - name: Compare verdicts
        env:
          BASE_SHA: ${{ needs.verdict-changes.outputs.base-sha }}
        run: >-
          uv run --no-sync python scripts/check_verdict_change.py compare
          "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" --released-ref "$BASE_SHA"

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, pytest-compat, docs, security, attrs-smoke, verdict-changes, verdict-change]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SRC_CHANGED: ${{ needs.changes.outputs.src }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PYTEST_COMPAT_RESULT: ${{ needs.pytest-compat.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ATTRS_SMOKE_RESULT: ${{ needs.attrs-smoke.result }}
          VERDICT_CHANGES_RESULT: ${{ needs.verdict-changes.result }}
          VERDICT_GUARDED: ${{ needs.verdict-changes.outputs.guarded }}
          VERDICT_CHANGE_RESULT: ${{ needs.verdict-change.result }}
        run: |
          # Without a successful Detect Changes the outputs below are empty, so every gated check would look skipped
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Detect Changes did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          # For docs-only changes, skip src-related checks
          if [[ "$SRC_CHANGED" == "true" ]]; then
            if [[ "$LINT_RESULT" != "success" ]] || \
               [[ "$TYPECHECK_RESULT" != "success" ]] || \
               [[ "$TEST_RESULT" != "success" ]] || \
               [[ "$PYTEST_COMPAT_RESULT" != "success" ]] || \
               [[ "$SECURITY_RESULT" != "success" ]] || \
               [[ "$ATTRS_SMOKE_RESULT" != "success" ]] || \
               [[ "$VERDICT_CHANGES_RESULT" != "success" ]]; then
              echo "Source code checks failed"
              exit 1
            fi
          fi

          # The verdict check is skipped, not failed, when no path the cache-version guard covers changed
          if [[ "$VERDICT_GUARDED" == "true" ]] && [[ "$VERDICT_CHANGE_RESULT" != "success" ]]; then
            echo "Verdict change check failed"
            exit 1
          fi

          # Docs check runs for both src and docs changes
          if [[ "$SRC_CHANGED" == "true" ]] || [[ "$DOCS_CHANGED" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation check failed"
              exit 1
            fi
          fi

          echo "All required checks passed!"
