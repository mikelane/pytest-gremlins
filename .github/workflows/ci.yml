name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'tox.ini'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '*.md'
            changelog:
              - 'CHANGELOG.md'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy src/pytest_gremlins

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.src == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        shell: bash
        env:
          COVERAGE_PROCESS_START: pyproject.toml
          PYTHONPATH: .
        run: |
          uv run coverage run -m pytest tests -m "small or medium and not wip" -v
          uv run coverage combine --quiet || echo "::warning::No coverage data to combine (expected in some environments)"
          uv run coverage report --show-missing
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  pytest-compat:
    name: Test (pytest ${{ matrix.pytest }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    env:
      UV_PYTHON: '3.12'
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release of each supported pytest major, then the latest release.
        # The first entry must equal the pytest floor in pyproject.toml and tox.ini
        # (guarded by tests/config/test_pytest_version_matrix.py).
        pytest: ['8.4.2', '9.0.0', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install pytest ${{ matrix.pytest }}
        env:
          PYTEST_VERSION: ${{ matrix.pytest }}
        run: |
          # pytest-test-categories 1.2.2 needs pytest>=9.1.1; 1.2.1 is the newest release for older pytest.
          if [[ "$PYTEST_VERSION" == "latest" ]]; then
            uv pip install --python .venv/bin/python --upgrade pytest pytest-test-categories
          else
            uv pip install --python .venv/bin/python "pytest==$PYTEST_VERSION" "pytest-test-categories<1.2.2"
          fi
          uv pip check --python .venv/bin/python
          uv run --no-sync pytest --version

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run --no-sync pytest tests -m "small or medium and not wip" -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run doctests
        # Disable test-category hermeticity enforcement for doctests: doctests
        # have no mechanism to declare a size marker, so pytest-test-categories
        # flags incidental reads (e.g. ~/.pdbrc from pdb internals) as violations.
        run: uv run pytest --doctest-modules src/pytest_gremlins --override-ini="test_categories_enforcement=disabled"

      - name: Build docs
        run: uv run mkdocs build --strict

      # The topmost entry is the one being prepared for release. The release itself runs the same check.
      - name: Check the newest changelog entry links to the docs
        if: needs.changes.outputs.changelog == 'true'
        run: uv run python scripts/check_release_docs.py --newest --site-dir site

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run pip-audit
        run: uv run pip-audit

  attrs-smoke:
    name: Attrs Smoke Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Restore attrs checkout cache
        id: attrs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Clone attrs on cache miss
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/python-attrs/attrs.git /tmp/attrs-checkout
          cd /tmp/attrs-checkout
          git checkout bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Save attrs checkout cache
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Run attrs smoke test
        run: uv run pytest tests/integration/test_attrs_smoke.py -m medium -v

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, pytest-compat, docs, security, attrs-smoke]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          SRC_CHANGED: ${{ needs.changes.outputs.src }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PYTEST_COMPAT_RESULT: ${{ needs.pytest-compat.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ATTRS_SMOKE_RESULT: ${{ needs.attrs-smoke.result }}
        run: |
          # For docs-only changes, skip src-related checks
          if [[ "$SRC_CHANGED" == "true" ]]; then
            if [[ "$LINT_RESULT" != "success" ]] || \
               [[ "$TYPECHECK_RESULT" != "success" ]] || \
               [[ "$TEST_RESULT" != "success" ]] || \
               [[ "$PYTEST_COMPAT_RESULT" != "success" ]] || \
               [[ "$SECURITY_RESULT" != "success" ]] || \
               [[ "$ATTRS_SMOKE_RESULT" != "success" ]]; then
              echo "Source code checks failed"
              exit 1
            fi
          fi

          # Docs check runs for both src and docs changes
          if [[ "$SRC_CHANGED" == "true" ]] || [[ "$DOCS_CHANGED" == "true" ]]; then
            if [[ "$DOCS_RESULT" != "success" ]]; then
              echo "Documentation check failed"
              exit 1
            fi
          fi

          echo "All required checks passed!"
