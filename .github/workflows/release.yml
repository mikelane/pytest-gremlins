name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  # Run full test suite before release
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage (small + medium, matching PR CI)
        env:
          COVERAGE_PROCESS_START: pyproject.toml
          PYTHONPATH: .
        run: |
          uv run coverage run -m pytest tests -m "small or medium" -v
          # Expected: coverage combine exits non-zero with a single data file.
          uv run coverage combine --quiet || echo "::notice::coverage combine found nothing to combine (single data file). This is normal."
          uv run coverage report --show-missing

      - name: Run benchmark tests (correctness only, no coverage threshold)
        run: uv run pytest tests/benchmark -v

  # Run benchmarks as part of release
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv sync
          uv pip install --python .venv/bin/python mutmut psutil

      - name: Run benchmarks
        run: |
          uv run python benchmarks/run_benchmarks.py \
            --project synthetic \
            --runs 3 \
            --output benchmarks/results/

      - name: Find latest results file
        id: find_results
        run: |
          LATEST=$(ls -t benchmarks/results/benchmark_*.json 2>/dev/null | head -1 || true)
          if [[ -z "$LATEST" ]]; then
            echo "::error::No benchmark result files found in benchmarks/results/. The benchmark run may have failed silently."
            exit 1
          fi
          echo "results_file=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Found results file: $LATEST"

      - name: Check for regression
        id: check_regression
        run: |
          uv run python benchmarks/check_regression.py \
            --baseline benchmarks/baseline.json \
            --current "${{ steps.find_results.outputs.results_file }}" \
            --threshold 10 | tee regression_report.txt
        continue-on-error: true

      - name: Annotate benchmark regression
        if: steps.check_regression.outcome == 'failure'
        run: |
          echo "::warning::Benchmark regression detected (>10% threshold). Review regression_report.txt in the 'benchmark-results' artifact."
          echo "### Benchmark Regression Detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The benchmark regression check exceeded the 10% threshold." >> "$GITHUB_STEP_SUMMARY"
          echo "The release will proceed, but review the regression report in the artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat regression_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            regression_report.txt
          retention-days: 90

  # Full attrs compatibility gate
  attrs-compat:
    name: Attrs Compatibility
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Restore attrs checkout cache
        id: attrs-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Clone attrs on cache miss
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/python-attrs/attrs.git /tmp/attrs-checkout
          cd /tmp/attrs-checkout
          git checkout bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Save attrs checkout cache
        if: steps.attrs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/attrs-checkout
          key: attrs-bd2446d77736a164b59b268a3792ed3e4bfba088

      - name: Run full attrs compatibility test
        run: uv run pytest tests/integration/test_attrs_full.py -m "medium or large" -v

  # Build the package
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, benchmark, attrs-compat]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Publish to Test PyPI first
  publish-test-pypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/pytest-gremlins/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Verify installation from Test PyPI
  verify-test-pypi:
    name: Verify Test PyPI Installation
    runs-on: ubuntu-latest
    needs: [publish-test-pypi]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Wait for Test PyPI to update
        run: sleep 30

      - name: Install from Test PyPI
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            pytest-gremlins

      - name: Verify import
        run: |
          .venv/bin/python -c "import pytest_gremlins; print(f'Version: {pytest_gremlins.__version__}')"

  # Publish to Production PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify-test-pypi]
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-gremlins/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: benchmark-results/

      - name: Extract changelog for this version
        id: changelog
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          # Extract version from tag (safe: github.ref is controlled by git tag)
          VERSION="${GIT_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Extract changelog section for this version.
          # The range pattern /start/,/end/ misfires when the start line also matches
          # the end pattern (e.g. "## v1.4.0" matches both /v?1.4.0/ and /v?[0-9]/).
          # Use a stateful awk instead: print lines after the version header is found,
          # stopping (without printing) when the next section header appears.
          awk "
            found && /^## v?[0-9]/ { exit }
            /^## v?$VERSION/       { found=1 }
            found                  { print }
          " CHANGELOG.md > release_notes.md

          # If no specific section found, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GIT_REF: ${{ github.ref }}
        with:
          body_path: release_notes.md
          files: |
            dist/*
            benchmark-results/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
